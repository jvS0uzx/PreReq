<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhe da Categoria')}"></head>
<body>
  <header th:replace="~{fragments/layout :: menu}"></header>

  <main class="container">
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <article>
        <header>
            <h1 id="nomeCategoria" th:text="${categoria.nomeNoPortal}"></h1>
            <button type="button" class="outline" onclick="copiarNome()">Copiar nome</button>
        </header>

        <div class="grid">
            <div>
                <h3>Quando usar</h3>
                <p th:text="${categoria.quandoUsar}"></p>
            </div>
            <div>
                <h3>Quando não usar</h3>
                <p th:text="${categoria.quandoNaoUsar}"></p>
            </div>
        </div>

        <h3>Checklist de Documentos</h3>
        <fieldset>
            <label th:each="doc : ${categoria.documentos}">
                <input type="checkbox">
                <span th:text="${doc.nome}"></span>
                <small th:if="${doc.ondeConseguir}" th:text="'(Onde conseguir: ' + ${doc.ondeConseguir} + ')'"></small>
            </label>
            <p th:if="${#lists.isEmpty(categoria.documentos)}">Nenhum documento adicional exigido.</p>
        </fieldset>

        <h3>Ordem de Tramitação</h3>
        <ol th:unless="${#lists.isEmpty(categoria.setores)}">
            <li th:each="setor : ${categoria.setores}" th:text="${setor.nome}"></li>
        </ol>
        <p th:if="${#lists.isEmpty(categoria.setores)}">Os setores desta categoria ainda não foram levantados.</p>

        <h3>Avisos e Efeitos</h3>
        <div class="aviso aviso-atencao">
            <p th:if="${categoria.efeitos}" th:text="${categoria.efeitos}"></p>
            <ul>
                <li th:each="alerta : ${categoria.alertasDoGrupo()}" th:text="${alerta}"></li>
            </ul>
        </div>

        <div class="aviso aviso-info">
            <strong>Prazo de referência:</strong> em breve
        </div>

        <footer>
            <small>Revisado em <span th:text="${#temporals.format(categoria.dataRevisao, 'dd/MM/yyyy')}"></span></small>
        </footer>
    </article>

    <a th:href="@{/categorias}" role="button" class="secondary">Voltar para a lista</a>

  </main>

  <footer th:replace="~{fragments/layout :: rodape}"></footer>

  <script>
    function copiarNome() {
        var texto = document.getElementById("nomeCategoria").innerText;
        navigator.clipboard.writeText(texto).then(function() {
            alert("Nome exato copiado para a área de transferência!");
        });
    }
  </script>
</body>
</html>
