<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedido inválido')}"></head>
<body>
    <header th:replace="~{fragments/layout :: menu}"></header>
    <main class="container">
        <h1 th:text="'Erro ' + ${status}">Erro 400</h1>
        <p>Não foi possível atender a esse pedido. Confira o endereço e tente de novo.</p>
        <a th:href="@{/}" role="button">Voltar ao início</a>
    </main>
    <footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
